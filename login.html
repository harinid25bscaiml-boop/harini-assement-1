<!DOCTYPE html>
<html>
<head>
    <title>KPRCAS Login</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box{
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }

        .logo{
            width: 150px;
            margin-bottom: 15px;
        }

        h2{
            color: #0047AB;
            margin-bottom: 20px;
        }

        input{
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 95%;
            padding: 10px;
            background: #0047AB;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #003080;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <img src="logo.jpg" alt="KPRCAS Logo" class="logo">

        <h2>KPRCAS Login</h2>

        <form>
            <input type="text" placeholder="Username" required><br>
            <input type="password" placeholder="Password" required><br><br>
            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
